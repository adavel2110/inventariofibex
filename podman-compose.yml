services:
  db:
    image: docker.io/library/postgres:16-alpine
    container_name: inventariofibex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventariofibex
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Abcd1234
    volumes:
      - inventariofibex-pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./database/init:/docker-entrypoint-initdb.d/init:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d inventariofibex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      containerfile: Containerfile
    container_name: inventariofibex-backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: inventariofibex
      DB_USER: admin
      DB_PASSWORD: Abcd1234
      JWT_SECRET: inventariofibex_secret_key_2024
      JWT_EXPIRES_IN: 24h
    ports:
      - "3002:3002"
    volumes:
      - inventariofibex-uploads:/app/uploads

volumes:
  inventariofibex-pgdata:
    driver: local
  inventariofibex-uploads:
    driver: local
